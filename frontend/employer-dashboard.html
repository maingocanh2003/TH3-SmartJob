<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Nhà Tuyển Dụng - SmartJob</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-gray-50">

<nav class="navbar-blur sticky top-0 z-40 border-b border-gray-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg gradient-primary flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <span class="font-bold text-xl bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">SmartJob</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <a href="bi-dashboard.html" class="text-gray-600 hover:text-blue-600 transition">Báo cáo BI</a>
      <span class="text-gray-500">Xin chào, <span data-nav-username class="text-blue-600 font-medium"></span></span>
      <button data-logout class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Đăng xuất</button>
    </div>
  </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-10">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Dashboard Tuyển Dụng</h1>
      <p class="text-gray-500 text-sm mt-1">Quản lý tin tuyển dụng và đơn ứng tuyển</p>
    </div>
    <a href="post-job.html" class="px-5 py-2.5 gradient-primary text-white rounded-xl font-semibold hover:opacity-90 transition flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Đăng tin mới
    </a>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        </div>
        <div>
          <div id="stat-total-jobs" class="text-2xl font-bold text-gray-800">—</div>
          <div class="text-xs text-gray-500">Tổng tin đăng</div>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <div id="stat-active-jobs" class="text-2xl font-bold text-gray-800">—</div>
          <div class="text-xs text-gray-500">Đang tuyển</div>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <div>
          <div id="stat-total-apps" class="text-2xl font-bold text-gray-800">—</div>
          <div class="text-xs text-gray-500">Tổng đơn nhận</div>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-yellow-100 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <div id="stat-pending-apps" class="text-2xl font-bold text-gray-800">—</div>
          <div class="text-xs text-gray-500">Chờ duyệt</div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Job listings -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100">
      <div class="flex items-center justify-between p-6 border-b border-gray-100">
        <h2 class="font-semibold text-gray-800">Tin Tuyển Dụng Của Bạn</h2>
        <a href="post-job.html" class="text-sm text-blue-600 hover:underline">+ Thêm mới</a>
      </div>
      <div id="jobs-table" class="overflow-x-auto">
        <div class="p-6 space-y-3">
          <div class="animate-pulse h-12 bg-gray-100 rounded-xl"></div>
          <div class="animate-pulse h-12 bg-gray-100 rounded-xl"></div>
          <div class="animate-pulse h-12 bg-gray-100 rounded-xl"></div>
        </div>
      </div>
    </div>

    <!-- Applications -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100">
      <div class="flex items-center justify-between p-6 border-b border-gray-100">
        <h2 class="font-semibold text-gray-800">Đơn Ứng Tuyển Mới Nhất</h2>
        <span class="text-xs text-gray-400">Cập nhật trạng thái trực tiếp</span>
      </div>
      <div id="apps-list" class="p-6 space-y-3">
        <div class="animate-pulse h-16 bg-gray-100 rounded-xl"></div>
        <div class="animate-pulse h-16 bg-gray-100 rounded-xl"></div>
        <div class="animate-pulse h-16 bg-gray-100 rounded-xl"></div>
      </div>
    </div>
  </div>

  <!-- Recommended candidates (from a specific job) -->
  <div id="recommended-section" class="hidden mt-8 bg-white rounded-2xl shadow-sm border border-gray-100">
    <div class="flex items-center justify-between p-6 border-b border-gray-100">
      <div>
        <h2 class="font-semibold text-gray-800">Ứng Viên Được AI Gợi Ý</h2>
        <p id="rec-job-title" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <button id="btn-close-recs" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="recs-grid" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const STATUS_LABELS = { pending: 'Chờ duyệt', reviewed: 'Đã xem', accepted: 'Chấp nhận', rejected: 'Từ chối' };
const STATUS_COLORS = { pending: 'bg-yellow-100 text-yellow-700', reviewed: 'bg-blue-100 text-blue-700', accepted: 'bg-green-100 text-green-700', rejected: 'bg-red-100 text-red-700' };

async function loadDashboard() {
  const user = getUser();
  const companyId = user.company_id;
  let jobs = [];
  let apps = [];

  // Load jobs
  try {
    const jData = await apiGet(companyId ? `/companies/${companyId}/jobs/` : `/jobs/`);
    jobs = jData.results ?? jData;

    document.getElementById('stat-total-jobs').textContent = jobs.length;
    document.getElementById('stat-active-jobs').textContent = jobs.filter(j => j.status === 'active').length;

    document.getElementById('jobs-table').innerHTML = jobs.length ? `
      <div class="divide-y divide-gray-50">
        ${jobs.map(j => `
        <div class="flex items-center gap-4 px-6 py-4 hover:bg-gray-50 transition">
          <div class="flex-1 min-w-0">
            <p class="font-medium text-sm text-gray-800 truncate">${j.title}</p>
            <p class="text-xs text-gray-400">${j.location || ''} · ${j.applications_count ?? 0} đơn</p>
          </div>
          <span class="text-xs px-2.5 py-1 rounded-full font-medium ${j.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${j.status === 'active' ? 'Đang tuyển' : 'Đã đóng'}</span>
          <button onclick="loadRecommended(${j.id}, '${j.title}')" class="text-xs px-3 py-1.5 text-purple-600 border border-purple-200 rounded-lg hover:bg-purple-50 transition flex-shrink-0">AI gợi ý</button>
          <a href="job-detail.html?id=${j.id}" class="text-xs px-3 py-1.5 text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-50 transition flex-shrink-0">Xem</a>
        </div>`).join('')}
      </div>` :
      '<div class="p-6 text-center text-gray-400"><p class="mb-4">Bạn chưa có tin tuyển dụng nào.</p><a href="post-job.html" class="text-blue-600 hover:underline">Đăng tin ngay</a></div>';
  } catch (err) {
    document.getElementById('jobs-table').innerHTML = `<div class="p-6 text-center text-red-400">Lỗi: ${err.message}</div>`;
  }

  // Load applications
  try {
    const aData = await apiGet('/applications/');
    apps = aData.results ?? aData;

    document.getElementById('stat-total-apps').textContent = apps.length;
    document.getElementById('stat-pending-apps').textContent = apps.filter(a => a.status === 'pending').length;

    document.getElementById('apps-list').innerHTML = apps.length ? apps.slice(0, 8).map(a => `
      <div class="flex items-center gap-4 p-3 border border-gray-100 rounded-xl">
        <div class="w-9 h-9 gradient-primary rounded-full flex items-center justify-center text-white text-sm font-bold flex-shrink-0">
          ${(a.candidate_name || a.candidate?.full_name || 'U')[0].toUpperCase()}
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-sm text-gray-800 truncate">${a.candidate_name || a.candidate?.full_name || 'Ứng viên'}</p>
          <p class="text-xs text-gray-400 truncate">${a.job_title || a.job?.title || 'Việc làm'}</p>
        </div>
        <select onchange="updateAppStatus(${a.id}, this.value)" class="text-xs border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-400">
          ${Object.entries(STATUS_LABELS).map(([v, l]) => `<option value="${v}" ${a.status === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>`).join('') :
      '<p class="text-center text-gray-400 py-6 text-sm">Chưa có đơn ứng tuyển nào</p>';
  } catch (err) {
    document.getElementById('apps-list').innerHTML = `<p class="text-red-400 text-sm">Lỗi: ${err.message}</p>`;
  }
}

async function updateAppStatus(appId, status) {
  try {
    await apiPatch(`/applications/${appId}/update_status/`, { status });
    showToast('Cập nhật trạng thái thành công!', 'success');
    // Update pending count
    const aData = await apiGet('/applications/');
    const apps = aData.results ?? aData;
    document.getElementById('stat-pending-apps').textContent = apps.filter(a => a.status === 'pending').length;
  } catch (err) { showToast('Lỗi cập nhật: ' + err.message, 'error'); }
}

async function loadRecommended(jobId, jobTitle) {
  const sec = document.getElementById('recommended-section');
  const grid = document.getElementById('recs-grid');
  document.getElementById('rec-job-title').textContent = `Gợi ý cho: ${jobTitle}`;
  sec.classList.remove('hidden');
  grid.innerHTML = '<div class="animate-pulse h-20 bg-gray-100 rounded-xl col-span-2"></div>';
  sec.scrollIntoView({ behavior: 'smooth' });

  try {
    const data = await apiGet(`/jobs/${jobId}/recommended_candidates/`);
    const candidates = data.results ?? data;
    if (!candidates.length) {
      grid.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-8">Chưa có ứng viên phù hợp</p>';
      return;
    }
    grid.innerHTML = candidates.slice(0, 6).map(c => {
      const score = c.match_score ?? c.score ?? null;
      const colors = score !== null ? scoreColor(score) : { text: 'text-gray-500', bg: 'bg-gray-100' };
      return `
      <div class="flex items-center gap-4 p-4 border border-gray-100 rounded-xl hover:border-purple-200 transition">
        <div class="w-10 h-10 gradient-primary rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">
          ${(c.full_name || c.name || 'U')[0].toUpperCase()}
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-sm text-gray-800">${c.full_name || c.name || 'Ứng viên'}</p>
          <p class="text-xs text-gray-400">${c.desired_position || c.job_title || ''}</p>
        </div>
        ${score !== null ? `<div class="text-center flex-shrink-0"><div class="text-lg font-bold ${colors.text}">${score}%</div><div class="text-xs text-gray-400">Match</div></div>` : ''}
      </div>`;
    }).join('');
  } catch (err) {
    grid.innerHTML = `<p class="col-span-2 text-center text-red-400 py-6">Lỗi: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (!requireLogin()) return;
  loadDashboard();
  document.getElementById('btn-close-recs').addEventListener('click', () => {
    document.getElementById('recommended-section').classList.add('hidden');
  });
});
</script>
</body>
</html>
