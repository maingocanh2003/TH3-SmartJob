<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Nhập & Tạo Tài Khoản - SmartJob AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="min-h-screen gradient-hero flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-lg">
    <!-- Logo & Branding -->
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex items-center gap-2.5">
        <div class="w-11 h-11 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center shadow-lg border border-white/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <span class="text-white font-extrabold text-3xl tracking-tight">SmartJob</span>
      </a>
      <p class="text-blue-100 mt-1.5 text-sm">Hệ thống Tuyển dụng & Gợi ý Việc làm Thông minh tích hợp AI & BI</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-white/40">
      <!-- Tabs: Đăng nhập / Tạo tài khoản -->
      <div class="flex border-b border-gray-100 bg-gray-50/70">
        <button id="tab-login" type="button" class="flex-1 py-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600 bg-white transition">
          Đăng nhập
        </button>
        <button id="tab-register" type="button" class="flex-1 py-4 text-sm font-bold text-gray-500 border-b-2 border-transparent transition hover:text-gray-700">
          Tạo tài khoản mới
        </button>
      </div>

      <div class="p-7 sm:p-8">
        <!-- ==================== FORM ĐĂNG NHẬP ==================== -->
        <form id="form-login" class="space-y-4">
          <!-- Chọn phân quyền truy cập -->
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Phân quyền truy cập (Vai trò đăng nhập)</label>
            <div class="grid grid-cols-2 gap-3">
              <button type="button" data-login-role="candidate" class="login-role-btn py-2.5 px-3 border-2 border-blue-500 bg-blue-50/80 rounded-xl text-xs font-bold text-blue-700 flex items-center justify-center gap-2 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span>Ứng viên / Người dùng</span>
              </button>
              <button type="button" data-login-role="company" class="login-role-btn py-2.5 px-3 border-2 border-gray-200 bg-white rounded-xl text-xs font-semibold text-gray-600 flex items-center justify-center gap-2 transition hover:border-indigo-300">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span>Nhà tuyển dụng</span>
              </button>
            </div>
            <input type="hidden" id="login-expected-role" value="candidate"/>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email đăng nhập</label>
            <input id="login-email" type="email" required placeholder="nhap@email.com"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mật khẩu</label>
            <div class="relative">
              <input id="login-password" type="password" required placeholder="••••••••"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-12"/>
              <button type="button" id="toggle-login-pw" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs font-medium px-4 py-3 rounded-xl"></div>

          <button type="submit" id="btn-login" class="w-full gradient-primary text-white py-3.5 rounded-xl font-bold text-sm hover:opacity-95 transition shadow-md flex items-center justify-center gap-2">
            <span>Đăng nhập vào hệ thống</span>
          </button>

          <!-- QUICK DEMO ACCOUNTS -->
          <div class="mt-5 pt-4 border-t border-gray-100">
            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2.5 text-center">Tài khoản Demo phân quyền sẵn (Bấm để đăng nhập 1 chạm)</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <button type="button" class="btn-quick-login text-left p-2.5 rounded-xl border border-blue-100 bg-blue-50/40 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between text-xs"
                data-email="le.quocv@gmail.com" data-pass="123456" data-role="candidate">
                <div class="min-w-0">
                  <p class="font-bold text-gray-800 truncate">👨‍💻 Lê Quốc Việt</p>
                  <p class="text-[11px] text-blue-600 font-medium">Quyền: Ứng viên (Frontend)</p>
                </div>
                <span class="text-blue-600 font-bold ml-1">&rarr;</span>
              </button>

              <button type="button" class="btn-quick-login text-left p-2.5 rounded-xl border border-blue-100 bg-blue-50/40 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between text-xs"
                data-email="nguyen.vana@gmail.com" data-pass="123456" data-role="candidate">
                <div class="min-w-0">
                  <p class="font-bold text-gray-800 truncate">👨‍💻 Nguyễn Văn An</p>
                  <p class="text-[11px] text-blue-600 font-medium">Quyền: Ứng viên (Backend)</p>
                </div>
                <span class="text-blue-600 font-bold ml-1">&rarr;</span>
              </button>

              <button type="button" class="btn-quick-login text-left p-2.5 rounded-xl border border-indigo-100 bg-indigo-50/40 hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center justify-between text-xs"
                data-email="hr@fpt.com" data-pass="123456" data-role="company">
                <div class="min-w-0">
                  <p class="font-bold text-gray-800 truncate">🏢 FPT Software</p>
                  <p class="text-[11px] text-indigo-600 font-medium">Quyền: Nhà tuyển dụng</p>
                </div>
                <span class="text-indigo-600 font-bold ml-1">&rarr;</span>
              </button>

              <button type="button" class="btn-quick-login text-left p-2.5 rounded-xl border border-indigo-100 bg-indigo-50/40 hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center justify-between text-xs"
                data-email="recruitment@vng.com.vn" data-pass="123456" data-role="company">
                <div class="min-w-0">
                  <p class="font-bold text-gray-800 truncate">🏢 VNG Corporation</p>
                  <p class="text-[11px] text-indigo-600 font-medium">Quyền: Nhà tuyển dụng</p>
                </div>
                <span class="text-indigo-600 font-bold ml-1">&rarr;</span>
              </button>
            </div>
          </div>
        </form>

        <!-- ==================== FORM TẠO TÀI KHOẢN ==================== -->
        <form id="form-register" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Chọn phân quyền tài khoản muốn tạo</label>
            <div class="grid grid-cols-2 gap-3">
              <button type="button" id="type-candidate" data-type="candidate"
                class="user-type-btn py-3 px-4 border-2 border-blue-500 bg-blue-50 rounded-xl text-xs font-bold text-blue-700 flex flex-col items-center gap-1 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span>Ứng viên / Người dùng</span>
              </button>
              <button type="button" id="type-company" data-type="company"
                class="user-type-btn py-3 px-4 border-2 border-gray-200 rounded-xl text-xs font-bold text-gray-500 flex flex-col items-center gap-1 transition hover:border-blue-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span>Nhà tuyển dụng</span>
              </button>
            </div>
            <input type="hidden" id="reg-user-type" value="candidate"/>
          </div>

          <div id="field-fullname">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Họ và tên ứng viên <span class="text-red-500">*</span></label>
            <input id="reg-fullname" type="text" placeholder="VD: Nguyễn Văn A"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>

          <div id="field-company" class="hidden">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tên Doanh nghiệp / Nhà tuyển dụng <span class="text-red-500">*</span></label>
            <input id="reg-company" type="text" placeholder="VD: Công ty Công nghệ ABC"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Địa chỉ Email <span class="text-red-500">*</span></label>
            <input id="reg-email" type="email" required placeholder="example@email.com"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mật khẩu <span class="text-red-500">*</span></label>
            <input id="reg-password" type="password" required minlength="6" placeholder="Tối thiểu 6 ký tự"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>

          <div id="reg-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs font-medium px-4 py-3 rounded-xl"></div>
          <div id="reg-success" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium px-4 py-3 rounded-xl"></div>

          <button type="submit" id="btn-register" class="w-full gradient-primary text-white py-3.5 rounded-xl font-bold text-sm hover:opacity-95 transition shadow-md">
            Tạo tài khoản & Truy cập ngay
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-blue-100 text-xs mt-5">
      <a href="index.html" class="hover:text-white underline transition">&larr; Quay về trang chủ cổng việc làm</a>
    </p>
  </div>

  <script src="js/api.js?v=20261106_01"></script>
  <script src="js/auth.js?v=20261106_01"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      const u = getUser();
      window.location.href = (u.user_type === 'company' || u.user_type === 'admin')
        ? 'employer-dashboard.html'
        : 'candidate-profile.html';
    }

    const tabLogin = document.getElementById('tab-login');
    const tabReg   = document.getElementById('tab-register');
    const fLogin   = document.getElementById('form-login');
    const fReg     = document.getElementById('form-register');

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 py-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600 bg-white transition';
      tabReg.className   = 'flex-1 py-4 text-sm font-bold text-gray-500 border-b-2 border-transparent transition hover:text-gray-700';
      fLogin.classList.remove('hidden');
      fReg.classList.add('hidden');
    });

    tabReg.addEventListener('click', () => {
      tabReg.className   = 'flex-1 py-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600 bg-white transition';
      tabLogin.className = 'flex-1 py-4 text-sm font-bold text-gray-500 border-b-2 border-transparent transition hover:text-gray-700';
      fReg.classList.remove('hidden');
      fLogin.classList.add('hidden');
    });

    // Role selector on Login
    function setLoginRoleUI(role) {
      document.getElementById('login-expected-role').value = role;
      document.querySelectorAll('.login-role-btn').forEach(btn => {
        if (btn.dataset.loginRole === role) {
          btn.className = role === 'company'
            ? 'login-role-btn py-2.5 px-3 border-2 border-indigo-600 bg-indigo-50/80 rounded-xl text-xs font-bold text-indigo-700 flex items-center justify-center gap-2 transition'
            : 'login-role-btn py-2.5 px-3 border-2 border-blue-500 bg-blue-50/80 rounded-xl text-xs font-bold text-blue-700 flex items-center justify-center gap-2 transition';
        } else {
          btn.className = 'login-role-btn py-2.5 px-3 border-2 border-gray-200 bg-white rounded-xl text-xs font-semibold text-gray-600 flex items-center justify-center gap-2 transition hover:border-blue-300';
        }
      });
    }

    document.querySelectorAll('.login-role-btn').forEach(btn => {
      btn.addEventListener('click', () => setLoginRoleUI(btn.dataset.loginRole));
    });

    // Role selector on Register
    document.querySelectorAll('.user-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        document.getElementById('reg-user-type').value = type;
        document.querySelectorAll('.user-type-btn').forEach(b => {
          b.className = 'user-type-btn py-3 px-4 border-2 border-gray-200 rounded-xl text-xs font-bold text-gray-500 flex flex-col items-center gap-1 transition hover:border-blue-300';
        });
        btn.className = 'user-type-btn py-3 px-4 border-2 border-blue-500 bg-blue-50 rounded-xl text-xs font-bold text-blue-700 flex flex-col items-center gap-1 transition';
        if (type === 'company') {
          document.getElementById('field-fullname').classList.add('hidden');
          document.getElementById('field-company').classList.remove('hidden');
        } else {
          document.getElementById('field-fullname').classList.remove('hidden');
          document.getElementById('field-company').classList.add('hidden');
        }
      });
    });

    // Toggle password visibility
    document.getElementById('toggle-login-pw').addEventListener('click', () => {
      const inp = document.getElementById('login-password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    // Quick Demo Login
    document.querySelectorAll('.btn-quick-login').forEach(btn => {
      btn.addEventListener('click', () => {
        setLoginRoleUI(btn.dataset.role || 'candidate');
        document.getElementById('login-email').value = btn.dataset.email;
        document.getElementById('login-password').value = btn.dataset.pass;
        document.getElementById('form-login').dispatchEvent(new Event('submit', { cancelable: true }));
      });
    });

    // Login Submit
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');
      btn.disabled = true;
      btn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> <span>Đang xác thực phân quyền...</span>';
      errEl.classList.add('hidden');

      try {
        const data = await login(
          document.getElementById('login-email').value.trim(),
          document.getElementById('login-password').value
        );
        const roleLabel = data.user_type === 'company' ? 'Nhà tuyển dụng' : 'Ứng viên';
        showToast(`Đăng nhập thành công (${roleLabel})!`, 'success');
        setTimeout(() => {
          window.location.href = (data.user_type === 'company' || data.user_type === 'admin')
            ? 'employer-dashboard.html'
            : 'candidate-profile.html';
        }, 400);
      } catch (err) {
        errEl.textContent = err.message || 'Email hoặc mật khẩu không chính xác.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Đăng nhập vào hệ thống</span>';
      }
    });

    // Register Submit
    document.getElementById('form-register').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      const errEl = document.getElementById('reg-error');
      const sucEl = document.getElementById('reg-success');
      errEl.classList.add('hidden');
      sucEl.classList.add('hidden');

      const userType = document.getElementById('reg-user-type').value;
      const fullName = userType === 'candidate' ? document.getElementById('reg-fullname').value.trim() : '';
      const compName = userType === 'company' ? document.getElementById('reg-company').value.trim() : '';

      if (userType === 'candidate' && !fullName) {
        errEl.textContent = 'Vui lòng nhập họ và tên ứng viên.';
        errEl.classList.remove('hidden');
        return;
      }
      if (userType === 'company' && !compName) {
        errEl.textContent = 'Vui lòng nhập tên doanh nghiệp / nhà tuyển dụng.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang khởi tạo tài khoản...';

      try {
        const data = await register(
          document.getElementById('reg-email').value.trim(),
          document.getElementById('reg-password').value,
          userType,
          fullName,
          compName
        );
        sucEl.textContent = 'Tạo tài khoản thành công! Đang chuyển hướng vào trang làm việc...';
        sucEl.classList.remove('hidden');
        showToast('Đăng ký tài khoản thành công!', 'success');
        setTimeout(() => {
          if (isLoggedIn()) {
            window.location.href = userType === 'company' ? 'employer-dashboard.html' : 'candidate-profile.html';
          } else {
            tabLogin.click();
          }
        }, 700);
      } catch (err) {
        errEl.textContent = err.message || 'Đăng ký thất bại, vui lòng kiểm tra lại thông tin.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Tạo tài khoản & Truy cập ngay';
      }
    });
  </script>
</body>
</html>
