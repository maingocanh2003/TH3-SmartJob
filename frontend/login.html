<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập - SmartJob</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="min-h-screen gradient-hero flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2">
        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <span class="text-white font-bold text-2xl">SmartJob</span>
      </a>
      <p class="text-blue-200 mt-2 text-sm">Nền tảng tuyển dụng thông minh với AI</p>
    </div>

    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b border-gray-100">
        <button id="tab-login" class="flex-1 py-4 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition">Đăng nhập</button>
        <button id="tab-register" class="flex-1 py-4 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition hover:text-gray-600">Đăng ký</button>
      </div>

      <div class="p-8">
        <!-- LOGIN FORM -->
        <form id="form-login" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input id="login-email" type="email" required placeholder="example@email.com"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Mật khẩu</label>
            <div class="relative">
              <input id="login-password" type="password" required placeholder="••••••••"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-12"/>
              <button type="button" id="toggle-login-pw" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
          <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl"></div>
          <button type="submit" id="btn-login" class="w-full gradient-primary text-white py-3 rounded-xl font-semibold hover:opacity-90 transition flex items-center justify-center gap-2">
            <span>Đăng nhập</span>
          </button>

          <!-- QUICK DEMO ACCOUNTS -->
          <div class="mt-6 pt-5 border-t border-gray-100">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2.5 text-center">Tài khoản demo (Bấm để đăng nhập nhanh)</p>
            <div class="space-y-2">
              <button type="button" class="btn-quick-login w-full text-left px-3 py-2.5 rounded-xl border border-gray-200 hover:border-blue-500 hover:bg-blue-50/50 transition flex items-center justify-between text-xs"
                data-email="nguyen.vana@gmail.com" data-pass="123456">
                <div>
                  <span class="font-semibold text-gray-800">👨‍💻 Nguyễn Văn An</span>
                  <span class="text-gray-500 ml-1">(Ứng viên Python)</span>
                </div>
                <span class="text-blue-600 font-medium">Chọn</span>
              </button>
              <button type="button" class="btn-quick-login w-full text-left px-3 py-2.5 rounded-xl border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition flex items-center justify-between text-xs"
                data-email="hr@fpt.com" data-pass="123456">
                <div>
                  <span class="font-semibold text-gray-800">🏢 FPT Software</span>
                  <span class="text-gray-500 ml-1">(Doanh nghiệp)</span>
                </div>
                <span class="text-indigo-600 font-medium">Chọn</span>
              </button>
              <button type="button" class="btn-quick-login w-full text-left px-3 py-2.5 rounded-xl border border-gray-200 hover:border-purple-500 hover:bg-purple-50/50 transition flex items-center justify-between text-xs"
                data-email="admin@smartjob.vn" data-pass="123456">
                <div>
                  <span class="font-semibold text-gray-800">🛡️ Quản trị viên</span>
                  <span class="text-gray-500 ml-1">(Admin hệ thống)</span>
                </div>
                <span class="text-purple-600 font-medium">Chọn</span>
              </button>
            </div>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" class="space-y-4 hidden">
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="type-candidate" data-type="candidate"
              class="user-type-btn py-3 px-4 border-2 border-blue-500 bg-blue-50 rounded-xl text-sm font-medium text-blue-700 flex flex-col items-center gap-1 transition">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Ứng viên
            </button>
            <button type="button" id="type-company" data-type="company"
              class="user-type-btn py-3 px-4 border-2 border-gray-200 rounded-xl text-sm font-medium text-gray-500 flex flex-col items-center gap-1 transition hover:border-blue-300">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
              Nhà tuyển dụng
            </button>
          </div>
          <input type="hidden" id="reg-user-type" value="candidate"/>

          <div id="field-fullname">
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Họ và tên</label>
            <input id="reg-fullname" type="text" placeholder="Nguyễn Văn A"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div id="field-company" class="hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Tên công ty</label>
            <input id="reg-company" type="text" placeholder="Công ty TNHH ABC"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input id="reg-email" type="email" required placeholder="example@email.com"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Mật khẩu</label>
            <input id="reg-password" type="password" required placeholder="Ít nhất 6 ký tự"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div id="reg-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl"></div>
          <div id="reg-success" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-xl"></div>
          <button type="submit" class="w-full gradient-primary text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Tạo tài khoản</button>
        </form>
      </div>
    </div>

    <p class="text-center text-blue-200 text-sm mt-6">
      <a href="index.html" class="hover:text-white transition">&larr; Về trang chủ</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      const u = getUser();
      window.location.href = u.user_type === 'company'
        ? 'employer-dashboard.html'
        : u.user_type === 'admin'
          ? 'bi-dashboard.html'
          : 'candidate-profile.html';
    }

    // Tab switching
    const tabLogin = document.getElementById('tab-login');
    const tabReg   = document.getElementById('tab-register');
    const fLogin   = document.getElementById('form-login');
    const fReg     = document.getElementById('form-register');

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 py-4 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition';
      tabReg.className   = 'flex-1 py-4 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition hover:text-gray-600';
      fLogin.classList.remove('hidden'); fReg.classList.add('hidden');
    });
    tabReg.addEventListener('click', () => {
      tabReg.className   = 'flex-1 py-4 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition';
      tabLogin.className = 'flex-1 py-4 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition hover:text-gray-600';
      fReg.classList.remove('hidden'); fLogin.classList.add('hidden');
    });

    // User type toggle
    document.querySelectorAll('.user-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        document.getElementById('reg-user-type').value = type;
        document.querySelectorAll('.user-type-btn').forEach(b => {
          b.className = 'user-type-btn py-3 px-4 border-2 border-gray-200 rounded-xl text-sm font-medium text-gray-500 flex flex-col items-center gap-1 transition hover:border-blue-300';
        });
        btn.className = 'user-type-btn py-3 px-4 border-2 border-blue-500 bg-blue-50 rounded-xl text-sm font-medium text-blue-700 flex flex-col items-center gap-1 transition';
        if (type === 'company') {
          document.getElementById('field-fullname').classList.add('hidden');
          document.getElementById('field-company').classList.remove('hidden');
        } else {
          document.getElementById('field-fullname').classList.remove('hidden');
          document.getElementById('field-company').classList.add('hidden');
        }
      });
    });

    // Toggle password visibility
    document.getElementById('toggle-login-pw').addEventListener('click', () => {
      const inp = document.getElementById('login-password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    // Quick Login Demo Buttons
    document.querySelectorAll('.btn-quick-login').forEach(btn => {
      btn.addEventListener('click', () => {
        const email = btn.dataset.email;
        const pass = btn.dataset.pass;
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').value = pass;
        document.getElementById('form-login').dispatchEvent(new Event('submit', { cancelable: true }));
      });
    });

    // Login form
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');
      btn.disabled = true;
      btn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Đang đăng nhập...';
      errEl.classList.add('hidden');
      try {
        const data = await login(document.getElementById('login-email').value, document.getElementById('login-password').value);
        showToast('Đăng nhập thành công!', 'success');
        setTimeout(() => {
          window.location.href = data.user_type === 'company'
            ? 'employer-dashboard.html'
            : data.user_type === 'admin'
              ? 'bi-dashboard.html'
              : 'candidate-profile.html';
        }, 500);
      } catch (err) {
        errEl.textContent = err.message || 'Email hoặc mật khẩu không đúng';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Đăng nhập</span>';
      }
    });

    // Register form
    document.getElementById('form-register').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('reg-error');
      const sucEl = document.getElementById('reg-success');
      errEl.classList.add('hidden');
      sucEl.classList.add('hidden');
      const userType = document.getElementById('reg-user-type').value;
      const fullName = userType === 'candidate' ? document.getElementById('reg-fullname').value : '';
      const compName = userType === 'company' ? document.getElementById('reg-company').value : '';
      try {
        await register(document.getElementById('reg-email').value, document.getElementById('reg-password').value, userType, fullName, compName);
        sucEl.textContent = 'Đăng ký thành công! Hãy đăng nhập để tiếp tục.';
        sucEl.classList.remove('hidden');
        setTimeout(() => tabLogin.click(), 1500);
      } catch (err) {
        errEl.textContent = err.message || 'Đăng ký thất bại, vui lòng thử lại';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
