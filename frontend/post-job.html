<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Tin Tuyển Dụng - SmartJob</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-gray-50">

<nav class="navbar-blur sticky top-0 z-40 border-b border-gray-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg gradient-primary flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <span class="font-bold text-xl bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">SmartJob</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <a href="employer-dashboard.html" class="text-gray-600 hover:text-blue-600 transition">&#8592; Dashboard</a>
      <span class="text-gray-500">Xin chào, <span data-nav-username class="text-blue-600 font-medium"></span></span>
      <button data-logout class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50" onclick="clearUser(); window.location.href='login.html';">Đăng xuất</button>
    </div>
  </div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-800">Đăng Tin Tuyển Dụng</h1>
    <p class="text-gray-500 text-sm mt-1">Điền đầy đủ thông tin để thu hút ứng viên phù hợp nhất</p>
  </div>

  <!-- Steps indicator -->
  <div class="flex items-center gap-4 mb-8">
    <div class="step-indicator flex items-center gap-2" data-step="1">
      <div class="w-8 h-8 rounded-full gradient-primary flex items-center justify-center text-white text-sm font-bold">1</div>
      <span class="text-sm font-medium text-blue-600">Thông tin cơ bản</span>
    </div>
    <div class="h-px flex-1 bg-gray-200"></div>
    <div class="step-indicator flex items-center gap-2" data-step="2">
      <div id="step2-circle" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-sm font-bold">2</div>
      <span id="step2-label" class="text-sm font-medium text-gray-400">Yêu cầu & Kỹ năng</span>
    </div>
    <div class="h-px flex-1 bg-gray-200"></div>
    <div class="step-indicator flex items-center gap-2" data-step="3">
      <div id="step3-circle" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-sm font-bold">3</div>
      <span id="step3-label" class="text-sm font-medium text-gray-400">Xem trước & Đăng</span>
    </div>
  </div>

  <!-- STEP 1: Basic Info -->
  <div id="step1" class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 space-y-6">
    <h2 class="font-semibold text-gray-800 text-lg border-b pb-3">Thông tin cơ bản</h2>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Tiêu đề công việc <span class="text-red-500">*</span></label>
      <input id="job-title-input" type="text" placeholder="VD: Senior Python Developer" required
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Loại hình <span class="text-red-500">*</span></label>
        <select id="job-type" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="full_time">Toàn thời gian</option>
          <option value="part_time">Bán thời gian</option>
          <option value="contract">Hợp đồng</option>
          <option value="internship">Thực tập</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Cấp bậc</label>
        <select id="job-level" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="junior">Junior</option>
          <option value="mid">Mid-level</option>
          <option value="senior">Senior</option>
          <option value="lead">Team Lead</option>
          <option value="manager">Manager</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Địa điểm <span class="text-red-500">*</span></label>
        <input id="job-location" type="text" placeholder="VD: Hà Nội, TP.HCM, Remote"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Ngành nghề</label>
        <input id="job-industry" type="text" placeholder="VD: Công nghệ thông tin"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Lương tối thiểu (VNĐ)</label>
        <input id="salary-min" type="number" placeholder="VD: 15000000"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Lương tối đa (VNĐ)</label>
        <input id="salary-max" type="number" placeholder="VD: 30000000"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Số lượng tuyển</label>
        <input id="job-slots" type="number" min="1" value="1"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Hạn nộp hồ sơ</label>
        <input id="job-deadline" type="date"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Mô tả công việc <span class="text-red-500">*</span></label>
      <textarea id="job-desc" rows="5" placeholder="Mô tả chi tiết về công việc, nhiệm vụ, trách nhiệm..."
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
    </div>
    <div class="flex justify-end">
      <button id="btn-next-1" class="px-8 py-3 gradient-primary text-white rounded-xl font-semibold hover:opacity-90 transition">
        Tiếp theo →
      </button>
    </div>
  </div>

  <!-- STEP 2: Requirements & Skills -->
  <div id="step2" class="hidden bg-white rounded-2xl p-8 shadow-sm border border-gray-100 space-y-6">
    <h2 class="font-semibold text-gray-800 text-lg border-b pb-3">Yêu cầu & Kỹ năng</h2>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Yêu cầu kinh nghiệm</label>
      <select id="job-exp" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="entry">Mới tốt nghiệp</option>
        <option value="junior">Dưới 2 năm</option>
        <option value="mid">2-5 năm</option>
        <option value="senior">5+ năm</option>
        <option value="manager">Quản lý</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Yêu cầu ứng viên</label>
      <textarea id="job-req" rows="5" placeholder="Các yêu cầu cụ thể về kỹ năng, kinh nghiệm, bằng cấp..."
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Quyền lợi</label>
      <textarea id="job-benefits" rows="4" placeholder="Các phúc lợi, đãi ngộ hấp dẫn..."
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Kỹ năng yêu cầu</label>
      <div id="selected-skills" class="flex flex-wrap gap-2 mb-3 min-h-8"></div>
      <div class="flex gap-2">
        <select id="skill-selector" class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">-- Chọn kỹ năng --</option>
        </select>
        <button id="btn-add-skill" type="button" class="px-4 py-2.5 gradient-primary text-white rounded-xl text-sm font-medium hover:opacity-90">Thêm</button>
      </div>
    </div>
    <div class="flex justify-between">
      <button id="btn-back-1" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50 transition">← Quay lại</button>
      <button id="btn-next-2" class="px-8 py-2.5 gradient-primary text-white rounded-xl font-semibold hover:opacity-90 transition">Xem trước →</button>
    </div>
  </div>

  <!-- STEP 3: Preview -->
  <div id="step3" class="hidden space-y-6">
    <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
      <h2 class="font-semibold text-gray-800 text-lg border-b pb-3 mb-5">Xem trước tin đăng</h2>
      <div id="preview-content" class="space-y-4 text-sm text-gray-700"></div>
    </div>
    <div id="post-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl"></div>
    <div class="flex justify-between">
      <button id="btn-back-2" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50 transition">← Chỉnh sửa</button>
      <button id="btn-post" class="px-10 py-3 gradient-primary text-white rounded-xl font-bold hover:opacity-90 transition flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Đăng tin
      </button>
    </div>
  </div>
</div>

<script src="js/api.js?v=20261104_03"></script>
<script src="js/auth.js?v=20261104_03"></script>
<script src="js/post-job.js?v=20261104_03"></script>
</body>
</html>
